<style>
.consultation-section {
    width: 100%;
    padding: 18px 0 72px;
}

.consultation-card {
    position: relative;
    width: 100%;
    min-height: 360px;
    display: grid;
    grid-template-columns: minmax(0, 54%) minmax(0, 46%);
    align-items: center;
    overflow: hidden;
    box-sizing: border-box;
    padding: 40px 58px 40px 28px;
    background: #f1f7ff;
    border: 1px solid #e4eef9;
    border-radius: 24px;
    direction: rtl;
}

.consultation-content {
    position: relative;
    width: 100%;
    min-width: 0;
    text-align: right;
    direction: rtl;
    z-index: 2;
    box-sizing: border-box;
    padding-right: 4px;
}

.consultation-label {
    display: inline-block;
    margin-bottom: 8px;
    color: #0b55a9;
    font-size: 13px;
    font-weight: 800;
}

.consultation-content h2 {
    margin: 0 0 16px;
    color: #0753a8;
    font-size: clamp(26px, 3vw, 34px);
    font-weight: 900;
    line-height: 1.55;
}

.consultation-content p {
    max-width: 470px;
    margin: 0 0 18px;
    color: #65758a;
    font-size: 14px;
    font-weight: 500;
    line-height: 2.05;
}

.consultation-features {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 24px;
}

.consultation-feature {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    color: #53657b;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.7;
}

.consultation-feature-check {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ffcf28;
    color: #ffffff;
}

.consultation-feature-check svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.consultation-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 155px;
    height: 48px;
    padding: 0 24px;
    color: #ffffff;
    background: #075bc4;
    border-radius: 24px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 7px 18px rgba(7, 91, 196, .16);
    transition:
        transform .25s ease,
        background-color .25s ease,
        box-shadow .25s ease;
}

.consultation-button:hover {
    background: #064da7;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(7, 91, 196, .21);
}

.consultation-button svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.consultation-visual {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    direction: ltr;
    box-sizing: border-box;
}

.consultation-visual::before {
    content: "";
    position: absolute;
    width: 310px;
    height: 310px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #fff9df;
}

.consultation-image {
    position: relative;
    z-index: 1;
    width: min(100%, 480px);
    max-width: 100%;
    max-height: 360px;
    object-fit: contain;
    display: block;
}

@media (max-width: 1100px) {
    .consultation-card {
        grid-template-columns: minmax(0, 55%) minmax(0, 45%);
        padding: 38px 46px 38px 24px;
        gap: 0;
    }

    .consultation-content {
        padding-right: 0;
    }

    .consultation-content h2 {
        font-size: 31px;
    }

    .consultation-content p {
        max-width: 430px;
    }

    .consultation-visual::before {
        width: 290px;
        height: 290px;
    }

    .consultation-image {
        max-height: 335px;
    }
}

@media (max-width: 1000px) {
    .consultation-card {
        grid-template-columns: minmax(0, 55%) minmax(0, 45%);
        padding: 36px 42px 36px 26px;
        min-height: 330px;
    }

    .consultation-content h2 {
        font-size: 28px;
    }

    .consultation-content p {
        font-size: 13px;
    }

    .consultation-feature {
        font-size: 13px;
    }

    .consultation-visual::before {
        width: 280px;
        height: 280px;
    }

    .consultation-image {
        max-height: 320px;
    }
}

@media (max-width: 900px) {
    .consultation-card {
        grid-template-columns: minmax(0, 56%) minmax(0, 44%);
        padding: 32px 30px 32px 22px;
        min-height: 320px;
    }

    .consultation-content h2 {
        font-size: 26px;
        margin-bottom: 13px;
    }

    .consultation-content p {
        font-size: 12.5px;
        line-height: 2;
        margin-bottom: 16px;
    }

    .consultation-features {
        gap: 8px;
        margin-bottom: 21px;
    }

    .consultation-feature {
        font-size: 12.5px;
    }

    .consultation-feature-check {
        width: 20px;
        height: 20px;
        flex-basis: 20px;
    }

    .consultation-button {
        min-width: 145px;
        height: 45px;
        font-size: 13px;
    }

    .consultation-visual::before {
        width: 250px;
        height: 250px;
    }

    .consultation-image {
        max-height: 280px;
    }
}

@media (max-width: 700px) {
    .consultation-section {
        padding: 8px 0 55px;
    }

    .consultation-card {
        min-height: auto;
        display: flex;
        flex-direction: column;
        padding: 20px 22px 26px;
        border-radius: 20px;
        gap: 12px;
    }

    .consultation-visual {
        order: 1;
        width: 100%;
        flex-basis: auto;
        height: 260px;
    }

    .consultation-visual::before {
        width: 230px;
        height: 230px;
    }

    .consultation-image {
        width: min(92%, 350px);
        max-height: 255px;
    }

    .consultation-content {
        order: 2;
        width: 100%;
        flex-basis: auto;
        padding-right: 0;
        text-align: right;
    }

    .consultation-label {
        margin-bottom: 6px;
        font-size: 13.5px;
    }

    .consultation-content h2 {
        font-size: 27px;
        line-height: 1.55;
        margin-bottom: 14px;
    }

    .consultation-content p {
        max-width: none;
        font-size: 15px;
        line-height: 2;
        margin-bottom: 20px;
    }

    .consultation-features {
        gap: 11px;
        margin-bottom: 24px;
    }

    .consultation-feature {
        font-size: 14.5px;
        gap: 11px;
        line-height: 1.6;
    }

    .consultation-feature-check {
        width: 22px;
        height: 22px;
        flex-basis: 22px;
    }

    .consultation-feature-check svg {
        width: 13px;
        height: 13px;
    }

    .consultation-button {
        width: 100%;
        height: 50px;
        font-size: 15px;
        border-radius: 25px;
    }

    .consultation-button svg {
        width: 19px;
        height: 19px;
    }
}

@media (max-width: 390px) {
    .consultation-visual {
        height: 230px;
    }

    .consultation-image {
        max-height: 225px;
    }

    .consultation-visual::before {
        width: 200px;
        height: 200px;
    }

    .consultation-content h2 {
        font-size: 24px;
    }

    .consultation-content p {
        font-size: 14px;
    }

    .consultation-feature {
        font-size: 13.5px;
    }

    .consultation-button {
        font-size: 14px;
    }
}
</style>

                    </div>

                    <div class="consultation-feature">
                        <span class="consultation-feature-check">
                            <svg viewBox="0 0 24 24">
                                <path d="m5 12 4 4L19 6"></path>
                            </svg>
                        </span>
                        <span style="font-size: 1.2rem;">مشاوره تلفنی و حضوری</span>
                    </div>

                    <div class="consultation-feature">
                        <span class="consultation-feature-check">
                            <svg viewBox="0 0 24 24">
                                <path d="m5 12 4 4L19 6"></path>
                            </svg>

        </div>

    </div>
</section>
