<style>
.paye-footer {
    width: 100%;
    background: #ffffff;
    overflow: hidden;
    direction: rtl;
}

.paye-footer-main {
    width: 100%;
    display: grid;
    grid-template-columns: 1.05fr .9fr 1.2fr 1.45fr;
    align-items: start;
    gap: 35px;
    padding: 8px 0 38px;
    box-sizing: border-box;
}

.paye-footer-column {
    min-width: 0;
}

.paye-footer-logo {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    direction: rtl;
}

.paye-footer-logo img {
    width: 180px;
    max-width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
}

.paye-footer-title {
    position: relative;
    margin: 0 0 19px;
    color: #0753a8;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.7;
}

.paye-footer-links {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 9px;
}

.paye-footer-links a {
    color: #718095;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.8;
    text-decoration: none;
    transition: color .2s ease, transform .2s ease;
}

.paye-footer-links a:hover {
    color: #0753a8;
    transform: translateX(-3px);
}

.paye-contact-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.paye-contact-item {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    direction: rtl;
}

.paye-contact-icon {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0753a8;
}

.paye-contact-icon svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.paye-contact-item span {
    min-width: 0;
    color: #718095;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.paye-newsletter-text {
    max-width: 330px;
    margin: -1px 0 15px;
    color: #718095;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 2;
}

.paye-newsletter-form {
    width: 100%;
    max-width: 335px;
    height: 42px;
    display: flex;
    align-items: center;
    padding: 4px;
    border: 1px solid #edf0f4;
    border-radius: 22px;
    background: #ffffff;
    box-sizing: border-box;
    box-shadow: 0 3px 15px rgba(30, 70, 115, .025);
    direction: rtl;
}

.paye-newsletter-input {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 15px;
    border: 0;
    outline: 0;
    background: transparent;
    color: #45566c;
    font-family: inherit;
    font-size: 10px;
    text-align: right;
}

.paye-newsletter-input::placeholder {
    color: #a6afb9;
    opacity: 1;
}

.paye-newsletter-button {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 11px;
    background: #0758b9;
    color: #ffffff;
    cursor: pointer;
    transition:
        background .2s ease,
        transform .2s ease;
}

.paye-newsletter-button:hover {
    background: #064d9f;
    transform: translateX(-2px);
}

.paye-newsletter-button svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* ===== پایین فوتر: کپی‌رایت وسط‌چین + شبکه‌های اجتماعی ===== */
.paye-footer-bottom {
    width: 100%;
    min-height: 61px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 0;
    border-top: 1px solid #edf0f4;
    box-sizing: border-box;
}

.paye-copyright {
    width: 100%;
    color: #8b96a4;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.8;
    text-align: center;
    direction: rtl;
}

.paye-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    direction: ltr;
}

.paye-social a {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0753a8;
    text-decoration: none;
    transition:
        transform .2s ease,
        color .2s ease;
}

.paye-social a:hover {
    color: #063f80;
    transform: translateY(-2px);
}

.paye-social svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

@media (max-width: 1050px) {
    .paye-footer-main {
        grid-template-columns: 1fr 1fr;
        gap: 38px 50px;
        padding-bottom: 34px;
    }

    .paye-footer-logo {
        justify-content: center;
    }

    .paye-footer-column:nth-child(2),
    .paye-footer-column:nth-child(3) {
        padding-top: 5px;
    }

    .paye-newsletter-text,
    .paye-newsletter-form {
        max-width: 100%;
    }
}

@media (max-width: 650px) {
    .paye-footer-main {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 32px;
        padding: 8px 0 32px;
    }

    .paye-footer-logo {
        width: 100%;
        justify-content: center;
        padding-bottom: 6px;
    }

    .paye-footer-logo img {
        width: 155px;
    }

    .paye-footer-column {
        width: 100%;
    }

    .paye-footer-column:not(:first-child) {
        padding: 0 4px;
        box-sizing: border-box;
    }

    .paye-footer-title {
        margin-bottom: 15px;
        font-size: 15px;
    }

    .paye-footer-links {
        gap: 11px;
    }

    .paye-footer-links a {
        font-size: 12.5px;
    }

    .paye-contact-list {
        gap: 13px;
    }

    .paye-contact-item {
        gap: 11px;
    }

    .paye-contact-icon {
        width: 22px;
        height: 22px;
        flex-basis: 22px;
    }

    .paye-contact-icon svg {
        width: 21px;
        height: 21px;
    }

    .paye-contact-item span {
        font-size: 12.5px;
    }

    .paye-newsletter-text {
        max-width: 100%;
        margin-bottom: 15px;
        font-size: 12.5px;
        line-height: 2;
    }

    .paye-newsletter-form {
        max-width: 100%;
        height: 48px;
        border-radius: 24px;
        padding: 5px;
    }

    .paye-newsletter-input {
        font-size: 12.5px;
        padding: 0 16px;
    }

    .paye-newsletter-button {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        border-radius: 12px;
    }

    .paye-newsletter-button svg {
        width: 19px;
        height: 19px;
    }

    .paye-footer-bottom {
        min-height: auto;
        gap: 14px;
        padding: 22px 0;
    }

    .paye-copyright {
        font-size: 11.5px;
        line-height: 2;
    }

    .paye-social {
        gap: 18px;
    }

    .paye-social a {
        width: 34px;
        height: 34px;
    }

    .paye-social svg {
        width: 24px;
        height: 24px;
    }
}

@media (max-width: 390px) {
    .paye-footer-main {
        gap: 28px;
    }

    .paye-footer-logo img {
        width: 145px;
    }

    .paye-footer-title {
        font-size: 14px;
    }

    .paye-footer-links a,
    .paye-contact-item span,
    .paye-newsletter-text,
    .paye-newsletter-input {
        font-size: 12px;
    }

    .paye-copyright {
        font-size: 11px;
    }

    .paye-newsletter-form {
        height: 46px;
    }

    .paye-newsletter-button {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
    }
}
</style>
