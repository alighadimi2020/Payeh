<style>
.advantages-section {
    width: 100%;
    padding: 0 0 34px;
    overflow: hidden;
}

.advantages-box {
    width: 100%;
    min-height: 92px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-items: center;
    background: #fff9e8;
    border-radius: 18px;
    padding: 14px 22px;
    box-sizing: border-box;
    direction: rtl;
}

.advantage-item {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    padding: 8px 18px;
    text-align: right;
    direction: rtl;
    position: relative;
}

.advantage-item:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 0;
    top: 12px;
    width: 1px;
    height: 50px;
    background: #eadfbd;
}

.advantage-icon {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e3a900;
}

.advantage-icon svg {
    width: 27px;
    height: 27px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.advantage-content {
    min-width: 0;
}

.advantage-content h3 {
    margin: 0 0 4px;
    color: #164578;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.7;
}

.advantage-content p {
    margin: 0;
    color: #7a8490;
    font-size: 10px;
    font-weight: 500;
    line-height: 1.8;
}

@media (max-width: 950px) {
    .advantages-box {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 0;
    }

    .advantage-item:nth-child(2)::after {
        display: none;
    }

    .advantage-item:nth-child(3)::after,
    .advantage-item:nth-child(4)::after {
        top: 8px;
        height: 50px;
    }

    .advantage-item {
        min-height: 62px;
    }
}

@media (max-width: 650px) {
    .advantages-section {
        padding-bottom: 28px;
    }

    .advantages-box {
        display: flex;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 12px 8px;
        border-radius: 16px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        scroll-snap-type: x proximity;
    }

    .advantages-box::-webkit-scrollbar {
        display: none;
    }

    .advantage-item {
        flex: 0 0 220px;
        width: 220px;
        min-height: 68px;
        padding: 8px 17px;
        box-sizing: border-box;
        justify-content: flex-start;
        scroll-snap-align: start;
    }

    .advantage-item:not(:last-child)::after {
        display: block;
        top: 9px;
        left: 0;
        height: 50px;
    }

    .advantage-icon {
        width: 39px;
        height: 39px;
        flex-basis: 39px;
    }

    .advantage-icon svg {
        width: 25px;
        height: 25px;
    }

    .advantage-content h3 {
        font-size: 12px;
    }

    .advantage-content p {
        font-size: 9.5px;
    }
}

@media (max-width: 390px) {
    .advantage-item {
        flex-basis: 205px;
        width: 205px;
    }
}
</style>

                <div class="advantage-content">
