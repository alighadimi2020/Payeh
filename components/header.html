<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payeh Header</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:180px;
  background:#fff;
  font-family:Tahoma,Arial,sans-serif;
  color:#123d78;
}
.payeh-header{
  width:min(1180px,calc(100% - 40px));
  margin:22px auto 0;
  position:relative;
  z-index:100;
}
.payeh-header-card{
  height:72px;
  padding:0 18px;
  border:1px solid rgba(221,232,247,.72);
  border-radius:18px;
  background:rgba(255,255,255,.58);
  box-shadow:
    0 9px 28px rgba(39,91,154,.09),
    inset 0 1px 0 rgba(255,255,255,.96);
  backdrop-filter:blur(22px) saturate(145%);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
}
.payeh-header-row{
  height:100%;
  display:grid;
  grid-template-columns:220px 1fr 190px;
  align-items:center;
  direction:rtl;
}
.payeh-brand{
  width:170px;
  height:105px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  text-decoration:none;
  position:relative;
  z-index:5;
  margin-top:-17px;
  margin-bottom:-17px;
}
.payeh-brand img{
  width:265px;
  height:205px;
  display:block;
  object-fit:contain;
  object-position:center;
}
.payeh-nav{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:36px;
}
.payeh-nav a{
  height:100%;
  display:flex;
  align-items:center;
  gap:10px;
  color:#143e7a;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  transition:color .2s ease;
}
.payeh-nav a:hover{color:#165ed0}
.payeh-chevron{
  width:6px;
  height:6px;
  border-left:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;
  transform:rotate(-45deg) translateY(-2px);
}
.payeh-actions{
  direction:ltr;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
}
.payeh-search{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}
.payeh-search img{
  width:24px;
  height:24px;
  object-fit:contain;
}
.payeh-login{
  height:42px;
  min-width:125px;
  padding:0 13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:13px;
  background:#174ed0;
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
  box-shadow:0 7px 16px rgba(23,78,208,.16);
  transition:background .2s ease,transform .2s ease,box-shadow .2s ease;
}
.payeh-login:hover{
  background:#1044ba;
  transform:translateY(-1px);
  box-shadow:0 9px 20px rgba(23,78,208,.22);
}
.payeh-login img{
  width:16px;
  height:16px;
  object-fit:contain;
}
.payeh-menu-toggle{
  display:none;
  width:42px;
  height:42px;
  padding:0;
  border:1px solid rgba(221,232,247,.8);
  border-radius:13px;
  background:rgba(255,255,255,.66);
  box-shadow:0 7px 18px rgba(39,91,154,.08),inset 0 1px 0 #fff;
  cursor:pointer;
}
.payeh-menu-icon{
  width:20px;
  height:16px;
  margin:auto;
  position:relative;
}
.payeh-menu-icon span{
  position:absolute;
  right:0;
  width:20px;
  height:2px;
  border-radius:10px;
  background:#164784;
  transition:.22s ease;
}
.payeh-menu-icon span:nth-child(1){top:0}
.payeh-menu-icon span:nth-child(2){top:7px}
.payeh-menu-icon span:nth-child(3){top:14px}
.payeh-menu-toggle.open .payeh-menu-icon span:nth-child(1){top:7px;transform:rotate(45deg)}
.payeh-menu-toggle.open .payeh-menu-icon span:nth-child(2){opacity:0}
.payeh-menu-toggle.open .payeh-menu-icon span:nth-child(3){top:7px;transform:rotate(-45deg)}
.payeh-mobile-menu{
  display:none;
  margin-top:9px;
  padding:7px;
  border:1px solid rgba(221,232,247,.82);
  border-radius:18px;
  background:rgba(255,255,255,.76);
  box-shadow:0 15px 35px rgba(39,91,154,.11),inset 0 1px 0 #fff;
  backdrop-filter:blur(22px) saturate(145%);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
}
.payeh-mobile-menu.open{display:block}
.payeh-mobile-menu a{
  min-height:45px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-radius:12px;
  color:#143e7a;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}
.payeh-mobile-menu a:hover{background:rgba(236,244,255,.8)}
.payeh-mobile-menu .mobile-login{
  justify-content:center;
  margin-top:4px;
  background:#174ed0;
  color:#fff;
}
@media(max-width:900px){
  .payeh-header{
    width:calc(100% - 24px);
    margin-top:14px;
  }
  .payeh-header-card{
    height:68px;
    padding:0 10px;
    border-radius:17px;
  }
  .payeh-header-row{
    display:flex;
    flex-direction:row;
    direction:ltr;
    justify-content:space-between;
    align-items:center;
  }
  .payeh-brand{
    order:1;
    width:135px;
    height:92px;
    margin-top:-8px;
    margin-bottom:-8px;
    justify-content:flex-start;
  }
  .payeh-brand img{
    width:160px;
    height:150px;
  }
  .payeh-nav,.payeh-actions{display:none}
  .payeh-menu-toggle{
    order:2;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
}
@media(max-width:480px){
  .payeh-header{width:calc(100% - 16px);margin-top:10px}
  .payeh-header-card{height:64px;padding:0 8px;border-radius:16px}
  .payeh-brand{width:119px;height:84px}
  .payeh-brand img{width:120px;height:220px;justify-content: left; margin-left: -28px}
  .payeh-menu-toggle{width:40px;height:40px;border-radius:12px}
}
</style>
</head>
<body>

<header class="payeh-header">
  <div class="payeh-header-card">
    <div class="payeh-header-row">

      <a class="payeh-brand" href="#" aria-label="پایه">
        <img src="/home/ali/Desktop/Payeh/modular/assets/images/logo.png" alt="پایه">
      </a>

      <nav class="payeh-nav" aria-label="منوی اصلی">
        <a href="#">مجله آنلاین <span class="payeh-chevron"></span></a>
        <a href="#">مشاوره <span class="payeh-chevron"></span></a>
        <a href="#">آموزش <span class="payeh-chevron"></span></a>
        <a href="#">درباره پایه</a>
      </nav>

      <div class="payeh-actions">
          <a class="payeh-search" href="#" aria-label="جستجو">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="m21 21-4.34-4.34"/>
                <circle cx="11" cy="11" r="8"/>
            </svg>
        </a>
        <a class="payeh-login" href="../login.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-key"><path d="M20 11v6"/><path d="M20 13h2"/><path d="M3 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 2.072.578"/><circle cx="10" cy="7" r="4"/><circle cx="20" cy="19" r="2"/></svg>
            <span>ورود / ثبت نام</span>
        </a>
      </div>

      <button class="payeh-menu-toggle" type="button" aria-label="باز کردن منو" aria-expanded="false">
        <span class="payeh-menu-icon">
          <span></span><span></span><span></span>
        </span>
      </button>

    </div>
  </div>

  <nav class="payeh-mobile-menu" aria-label="منوی موبایل">
    <a href="#">مجله آنلاین <span class="payeh-chevron"></span></a>
    <a href="#">مشاوره <span class="payeh-chevron"></span></a>
    <a href="#">آموزش <span class="payeh-chevron"></span></a>
    <a href="#">درباره پایه</a>
    <a class="mobile-login" href="../login.html">ورود / ثبت نام</a>
  </nav>
</header>

<script>
const toggle=document.querySelector(".payeh-menu-toggle");
const menu=document.querySelector(".payeh-mobile-menu");

toggle.addEventListener("click",()=>{
  const open=menu.classList.toggle("open");
  toggle.classList.toggle("open",open);
  toggle.setAttribute("aria-expanded",String(open));
});

document.addEventListener("click",e=>{
  if(!e.target.closest(".payeh-header")){
    menu.classList.remove("open");
    toggle.classList.remove("open");
    toggle.setAttribute("aria-expanded","false");
  }
});
</script>

</body>
</html>
