<style>
.service-bar-section {
    width: 100%;
    padding: 0;
}

.service-bar-section .service-bar {
    margin: 0 10px;
}

.service-bar {
    width: auto;
    min-height: 60px;
    display: flex;
    align-items: center;
    background: #f1f7ff;
    border: 1px solid #e5effb;
    border-radius: 18px;
    overflow: hidden;
}

.service-bar-marquee {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    display: block;
    position: relative;
}

.service-bar-track {
    width: max-content;
    max-width: none;
    display: flex;
    align-items: stretch;
    direction: ltr;
    transform: translate3d(0, 0, 0);
    will-change: transform;
}

.service-bar-item {
    position: relative;
    direction: rtl;
    flex: 0 0 auto;
    min-width: 0;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 18px;
    color: #123d73;
    text-decoration: none;
    transition: color .25s ease;
}

.service-bar-item:hover {
    color: #0a66c2;
}

.service-bar-icon {
    width: 24px;
    height: 24px;
    flex: 0 0 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.service-bar-icon svg {
    width: 20px;
    height: 20px;
    display: block;
}

.service-bar-label {
    white-space: nowrap;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
}

.service-bar-track--clone {
    display: none !important;
}

@media (min-width: 701px) {
    .service-bar-track {
        width: 100%;
        max-width: none;
        transform: translate3d(0, 0, 0) !important;
        animation: none !important;
    }

    .service-bar-item {
        flex: 1 1 0;
        min-width: 0;
    }
}

@media (max-width: 700px) {
    .service-bar-section {
        width: 100%;
        padding: 0;
    }

    .service-bar-section .service-bar {
        margin: 0 8px;
    }

    .service-bar {
        width: auto;
        min-height: 54px;
        border-radius: 15px;
        overflow: hidden;
    }

    .service-bar-marquee {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        position: relative;
    }

    .service-bar-track {
        width: max-content;
        max-width: none;
        flex: 0 0 auto;
        direction: ltr;
        will-change: transform;
        animation-name: serviceBarBounce;
        animation-duration: var(--service-bar-duration, 12s);
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        animation-direction: alternate;
        animation-play-state: running;
    }

    .service-bar-item {
        flex: 0 0 150px;
        width: 150px;
        min-width: 150px;
        min-height: 54px;
        padding: 8px 14px;
        justify-content: center;
        direction: rtl;
    }

    .service-bar-label {
        font-size: 13px;
    }

    @keyframes serviceBarBounce {
        from {
            transform: translate3d(0, 0, 0);
        }

        to {
            transform: translate3d(
                calc(-1 * var(--service-bar-distance, 0px)),
                0,
                0
            );
        }
    }
}

@media (max-width: 420px) {
    .service-bar-item {
        flex-basis: 140px;
        width: 140px;
        min-width: 140px;
    }

    .service-bar-label {
        font-size: 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .service-bar-track {
        animation: none !important;
        transform: translate3d(0, 0, 0) !important;
    }
}
</style>
