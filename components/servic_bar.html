<style>
.service-bar-section {
    width: 100%;
    padding: 8px 0 18px;
}

/* برای اینکه گوشه‌های گرد دیده بشن، یک فاصله کوچیک از کناره‌ها */
.service-bar-section .service-bar {
    margin: 0 10px;
}

.service-bar {
    width: auto;
    min-height: 60px;
    display: flex;
    align-items: center;
    background: #f1f7ff;
    border: 1px solid #e5effb;
    border-radius: 18px;
    overflow: hidden;
}

.service-bar-marquee {
    width: 100%;
    display: flex;
    align-items: stretch;
}

.service-bar-track {
    width: 100%;
    display: flex;
    align-items: stretch;
    direction: rtl;
}

.service-bar-item {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 18px;
    color: #123d73;
    text-decoration: none;
    transition: color .25s ease;
}

.service-bar-item:not(:last-child)::before {
    content: "";
    position: absolute;
    left: 0;
    top: 15px;
    width: 1px;
    height: 30px;
    background: #dce8f5;
}

.service-bar-item::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: 50%;
    transform: translateX(50%);
    width: 0;
    height: 2px;
    background: #0b3d91;
    border-radius: 2px 2px 0 0;
    transition: width .3s ease;
}

.service-bar-item:hover {
    color: #0b3d91;
}

.service-bar-item:hover::after {
    width: 55%;
}

.service-bar-icon {
    width: 26px;
    height: 26px;
    flex: 0 0 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #123d73;
}

.service-bar-icon svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.service-bar-label {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.6;
    white-space: nowrap;
}

.service-bar-track--clone {
    display: none;
}

@media (max-width: 900px) {
    .service-bar-item {
        padding-inline: 12px;
        gap: 8px;
    }

    .service-bar-label {
        font-size: 12.5px;
    }

    .service-bar-icon {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
    }

    .service-bar-icon svg {
        width: 20px;
        height: 20px;
    }
}

@media (max-width: 700px) {
    .service-bar-section {
        padding: 6px 0 16px;
    }

    .service-bar-section .service-bar {
        margin: 0 8px;
    }

    .service-bar {
        min-height: 54px;
        border-radius: 15px;
    }

    .service-bar-marquee {
        width: max-content;
        display: flex;
        align-items: stretch;
        flex: 0 0 auto;
        animation: serviceBarMarquee 17s linear infinite;
        will-change: transform;
        transform: translate3d(0, 0, 0);
    }

    .service-bar-track {
        width: max-content;
        flex: 0 0 auto;
        direction: rtl;
    }

    .service-bar-track--clone {
        display: flex;
    }

    .service-bar-item {
        flex: 0 0 150px;
        width: 150px;
        min-height: 54px;
        padding: 8px 14px;
        justify-content: center;
        direction: rtl;
    }

    .service-bar-item:not(:last-child)::before {
        top: 12px;
        height: 30px;
    }

    .service-bar-marquee:hover,
    .service-bar-marquee:focus-within {
        animation-play-state: running;
    }

    @keyframes serviceBarMarquee {
        from {
            transform: translate3d(0, 0, 0);
        }
        to {
            transform: translate3d(-50%, 0, 0);
        }
    }
}

@media (max-width: 420px) {
    .service-bar-item {
        flex-basis: 140px;
        width: 140px;
    }

    .service-bar-label {
        font-size: 12px;
    }
}
</style>
